name: Test unified MCP
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c locks/unified-py312.txt -e '.[dev]'
      - run: python -m pytest -q -m 'not backends'
      - run: |
          mkdir -p .cache/assets
          python scripts/bootstrap_backends.py --project-root "$PWD" --asset-root "$PWD/.cache/assets"
      - run: python -m pytest -q -m backends
        env:
          UNIFIED_CAD_BACKEND_CONFIG: ${{ github.workspace }}/unified-cad.local.json
